name: Build Cagan IP TV APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # gradlew var ama gradle-wrapper.jar yoksa da yeniden oluştur
      - name: Repair Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ] || [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Gradle Wrapper eksik veya bozuk. Yeniden oluşturuluyor..."

            rm -f gradlew
            rm -f gradlew.bat
            rm -rf gradle/wrapper

            gradle wrapper --gradle-version 8.7
          else
            echo "Gradle Wrapper mevcut."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check Gradle Wrapper
        run: |
          echo "Wrapper files:"
          ls -la gradle/wrapper
          ./gradlew --version

      - name: Build Debug APK
        env:
          CAGAN_CONFIG_URL: ${{ secrets.CAGAN_CONFIG_URL }}
        run: |
          ./gradlew clean :app:assembleDebug \
            -PCAGAN_CONFIG_URL="$CAGAN_CONFIG_URL" \
            --stacktrace

      - name: Find APK
        if: success()
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Cagan-IP-TV
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
